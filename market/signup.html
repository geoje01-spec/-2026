<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>해녀바당 회원가입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/market/app.css">
</head>
<body class="auth-page">
<main class="auth">
  <div class="auth-brand"><svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="15" r="9" fill="#e0531a"/><path d="M11.3 13.3c5.7 2 11.7 2 17.4 0" stroke="#fbf8f2" stroke-width="1.8" fill="none" stroke-linecap="round"/><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 28c2.8-2.1 5.7-2.1 8.5 0s5.7 2.1 8.5 0 5.7-2.1 8.5 0 5.7 2.1 8.5 0"/><path d="M7 34.5c2.2-1.6 4.3-1.6 6.5 0s4.3 1.6 6.5 0 4.3-1.6 6.5 0 4.3 1.6 6.5 0" opacity=".45"/></g></svg><span>해녀바당<small>Haenyeo Badang · Jeju</small></span></div>

  <div class="stack" style="gap:8px">
    <div class="eyebrow">회원가입</div>
    <h1>어떻게 오셨어요?</h1>
    <p class="muted" style="margin:0">고른 대로 해녀 화면이나 손님 화면이 열려요.</p>
  </div>

  <form id="signupForm" class="card" novalidate>
    <fieldset class="type-pick">
      <legend>회원 종류</legend>
      <label class="type-card"><input type="radio" name="userType" value="general" checked><b>손님</b><span>해산물을 보고 냉장고에서 받아 가요</span></label>
      <label class="type-card"><input type="radio" name="userType" value="haenyeo"><b>해녀</b><span>잡은 해산물을 찍어서 알려요</span></label>
    </fieldset>
    <p class="field-error" id="errUserType" hidden>회원 종류를 골라 주세요.</p>

    <label class="field">이름<input type="text" name="name" maxlength="20" autocomplete="name" placeholder="홍길동"></label>
    <p class="field-error" id="errName" hidden>이름을 적어 주세요.</p>

    <label class="field">아이디<input type="text" name="username" maxlength="20" autocomplete="username" placeholder="영문·숫자·한글 다 돼요"></label>
    <p class="field-error" id="errUsername" hidden>아이디를 적어 주세요.</p>
    <p class="field-error" id="errUsernameTaken" hidden>이미 쓰고 있는 아이디예요.</p>

    <label class="field">비밀번호
      <span class="pw-wrap"><input type="password" name="password" maxlength="50" autocomplete="new-password" placeholder="4자 이상"><button type="button" class="pw-eye" id="togglePassword" aria-label="비밀번호 보기">보기</button></span>
    </label>
    <p class="field-error" id="errPassword" hidden>비밀번호를 적어 주세요.</p>
    <p class="field-error" id="errPasswordLen" hidden>비밀번호는 4자 이상이어야 해요.</p>

    <button type="submit" class="btn primary big">회원가입</button>
  </form>

  <p class="auth-alt">이미 계정이 있으신가요? <a href="/market/login.html">로그인하기</a></p>
  <p class="muted small" style="margin:0;text-align:center">데모 모드: 회원 정보는 이 기기 브라우저에만 저장돼요.</p>
</main>
<script src="/market/auth.js"></script>
</body>
</html>
