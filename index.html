<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>숨비 지킴이 · 해녀바당</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Cormorant+Garamond:ital,wght@1,500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 두 앱을 한 주소에서: 위쪽 전환 띠 + 앱 두 개(각자 그대로)
   앱은 iframe으로 따로 띄워 두고 보이기만 바꿈 → 바꿔도 마이크로비트 연결·입력한 내용이 그대로 남음 */
:root{
  --bg:#F3EDE2; --surface:#FBF8F2; --ink:#10303A; --muted:#56696D; --line:#D8CDBB; --taewak:#E0531A;
  --display:"Nanum Myeongjo","Noto Serif KR","AppleMyungjo","Batang",serif;
  --latin:"Cormorant Garamond","Nanum Myeongjo",Georgia,serif;
  --body:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --bar:52px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1A1F; --surface:#13242A; --ink:#EFE7DA; --muted:#A7B4B2; --line:#2A3E45; --taewak:#FF7A3D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1A1F; --surface:#13242A; --ink:#EFE7DA; --muted:#A7B4B2; --line:#2A3E45; --taewak:#FF7A3D; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--body)}
.switch{position:fixed;inset:0 0 auto 0;z-index:5;padding-top:env(safe-area-inset-top,0px);
  background:var(--bg);border-bottom:3px double var(--line)}
.switch-in{height:var(--bar);max-width:1240px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:12px}
.mark{display:flex;align-items:center;gap:8px;font:800 15px/1 var(--display);white-space:nowrap}
.mark svg{width:28px;height:28px;color:var(--ink)}
.mark i{font:500 italic 13px/1 var(--latin);color:var(--muted)}
.seg{margin-left:auto;display:flex;border:1.5px solid var(--ink);border-radius:var(--r,6px);overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:8px 14px;font:700 15px/1 var(--body);color:var(--ink);white-space:nowrap}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible{outline:3px solid var(--taewak);outline-offset:-3px}
.seg small{display:block;margin-top:3px;font:500 11px/1 var(--body);opacity:.75}
.apps{position:fixed;left:0;right:0;bottom:0;top:calc(var(--bar) + 3px + env(safe-area-inset-top,0px))}
.apps iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
@media (max-width:520px){
  .mark i,.seg small{display:none}
  .seg{margin-left:auto}
  .seg button{padding:9px 12px}
}
@media (max-width:360px){.mark span{display:none}}
</style>
</head>
<body>
<header class="switch">
  <div class="switch-in">
    <div class="mark"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="15" r="9" fill="#e0531a"/><path d="M11.3 13.3c5.7 2 11.7 2 17.4 0" stroke="#fbf8f2" stroke-width="1.8" fill="none" stroke-linecap="round"/><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 28c2.8-2.1 5.7-2.1 8.5 0s5.7 2.1 8.5 0 5.7-2.1 8.5 0 5.7 2.1 8.5 0"/><path d="M7 34.5c2.2-1.6 4.3-1.6 6.5 0s4.3 1.6 6.5 0 4.3-1.6 6.5 0 4.3 1.6 6.5 0" opacity=".45"/></g></svg><span>김토끼</span><i>Haenyeo · Jeju</i></div>
    <nav class="seg" role="tablist" aria-label="앱 고르기">
      <button role="tab" id="t-sumbi" data-app="sumbi" aria-controls="sumbi">숨비 지킴이<small>해녀 안전 관제</small></button>
      <button role="tab" id="t-market" data-app="market" aria-controls="market">해녀바당<small>해산물 직거래</small></button>
    </nav>
  </div>
</header>
<main class="apps">
  <iframe id="sumbi" title="숨비 지킴이" data-src="/sumbi/" allow="serial; geolocation; clipboard-write" hidden></iframe>
  <iframe id="market" title="해녀바당" data-src="/market/" allow="geolocation; clipboard-write; camera" hidden></iframe>
</main>
<script>
// 주소 끝 #market 이면 해녀바당부터. 처음 고른 앱만 불러오고, 다른 앱은 눌렀을 때 처음 불러옴
const APPS = ["sumbi", "market"];
function show(app){
  if (!APPS.includes(app)) app = "sumbi";
  for (const a of APPS){
    const f = document.getElementById(a), on = a === app;
    if (on && !f.src) f.src = f.dataset.src;
    f.hidden = !on;
    document.getElementById("t-" + a).setAttribute("aria-selected", on);
  }
  document.title = (app === "market" ? "해녀바당" : "숨비 지킴이") + " · 김토끼";
  if (location.hash.slice(1) !== app) history.replaceState(null, "", "#" + app);
}
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => show(b.dataset.app));
addEventListener("hashchange", () => show(location.hash.slice(1)));
show(location.hash.slice(1));
</script>
</body>
</html>
