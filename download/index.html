<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>김토끼 자료 받기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
:root{--ink:#10303A;--paper:#F7F2E8;--bg:#EFE7DA;--line:#D6CCBA;--muted:#5A666A;--orange:#D9541E;--gold:#F0C070}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif;word-break:keep-all}
header{background:var(--ink);color:var(--paper);padding:28px 16px 24px}
.wrap{max-width:720px;margin:0 auto}
.kick{color:var(--gold);font-size:14px;font-weight:500}
h1{margin:6px 0 0;font-family:'Noto Serif KR',serif;font-weight:900;font-size:36px;line-height:1.15}
main{padding:24px 16px 40px}
h2{margin:28px 0 10px;font-family:'Noto Serif KR',serif;font-size:22px;border-bottom:3px solid var(--ink);padding-bottom:6px}
h2:first-child{margin-top:0}
.file{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:10px}
.file b{display:block;font-size:16px}
.file span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.btn{flex:none;display:inline-block;background:var(--orange);color:#fff;text-decoration:none;font-weight:700;font-size:15px;padding:10px 16px;border-radius:6px}
.btn:hover{background:#B5441A}
.apps{font-size:14px;color:var(--muted);margin-top:28px;line-height:1.8}
.apps a{color:var(--ink)}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="kick">2026 데모데이 · 팀 김토끼</div>
  <h1>자료 받기</h1>
</div></header>
<main><div class="wrap">
  <h2>발표자료</h2>
  <div class="file"><div><b>발표자료 PDF</b><span>24장 · 1.6MB · 어디서나 열림</span></div><a class="btn" href="kimtokki-slides.pdf" download="김토끼 발표자료 (5분).pdf">받기</a></div>
  <div class="file"><div><b>발표자료 PPT</b><span>24장 · 4.1MB · 발표 대본은 슬라이드 노트에 있음</span></div><a class="btn" href="kimtokki-slides.pptx" download="김토끼 발표자료 (5분).pptx">받기</a></div>

  <h2>포스터</h2>
  <div class="file"><div><b>포스터 그림 (PNG)</b><span>5002×7056 · 2.4MB · 화면·공유용</span></div><a class="btn" href="kimtokki-poster-A0.png" download="김토끼 포스터 (A0).png">받기</a></div>
  <div class="file"><div><b>포스터 인쇄용 (PDF)</b><span>A0 + 재단 여백 3mm · 2.3MB · 인쇄소에 보낼 파일</span></div><a class="btn" href="../poster/kimtokki-poster-A0.pdf" download="김토끼 포스터 (A0 인쇄용).pdf">받기</a></div>

  <p class="apps">웹앱 바로 열기 · <a href="../">숨비 지킴이</a> · <a href="../market/">해녀바당</a> · <a href="../poster/">포스터 보기</a></p>
</div></main>
</body>
</html>
